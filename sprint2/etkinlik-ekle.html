<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Etkinlik Ekle</title>
  <link rel="stylesheet" href="css/2211012057.css">
</head>
<body>
  <header>
    <h1>Etkinlik Ekle</h1>
    <nav>
      <a href="index.html">Ana Sayfa</a>
      <a href="etkinlikler.html">Etkinlikler</a>
      <a href="etkinlik-ekle.html" aria-current="page">Ekle</a>
      <a href="etkinlik-guncelle.html">Güncelle</a>
    </nav>
  </header>

  <main>
    <form action="#" method="post">
      <p>
        <label for="etkinlik-adi">Etkinlik adı</label>
        <input type="text" id="etkinlik-adi" name="etkinlik-adi" required>
      </p>

      <p>
        <label for="kategori">Kategori</label>
        <select id="kategori" name="kategori" required>
          <option value="" selected>Seçiniz</option>
          <option value="seminer">Seminer</option>
          <option value="atolye">Atölye</option>
          <option value="soylesi">Söyleşi</option>
          <option value="konferans">Konferans</option>
          <option value="diger">Diğer</option>
        </select>
      </p>

      <p>
        <label for="tarih">Tarih</label>
        <input type="text" id="tarih" name="tarih" placeholder="gg.aa.yyyy" required>
      </p>

      <p>
        <label for="aciklama">Açıklama</label>
        <textarea id="aciklama" name="aciklama" required></textarea>
      </p>

      <p>
        <button type="submit">Kaydet</button>
      </p>
    </form>
  </main>

  <footer>
    <p>Serhat Saraloğlu · 2026</p>
  </footer>
</body>
</html>
